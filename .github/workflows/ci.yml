name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: modimodi
          POSTGRES_PASSWORD: modimodi
          POSTGRES_DB: modimodi_test
        ports:
          - 5432:5432
        # Without the healthcheck the job races the container and fails
        # intermittently, which is worse than failing every time.
        options: >-
          --health-cmd "pg_isready -U modimodi -d modimodi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: '3000'
      LOG_LEVEL: silent
      CORS_ORIGINS: http://localhost:8081
      TRUST_PROXY: 'false'
      # Throwaway key for CI only; never used against real data.
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      JWT_SECRET: ci-only-secret-not-used-anywhere-real-000000
      DATABASE_URL: postgresql://modimodi:modimodi@localhost:5432/modimodi_test
      TEST_DATABASE_URL: postgresql://modimodi:modimodi@localhost:5432/modimodi_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Check the committed OpenAPI spec is current
        run: |
          npm run openapi
          if ! git diff --exit-code --stat -- openapi.json; then
            echo "::error::openapi.json is stale. Run 'npm run openapi' and commit the result."
            exit 1
          fi

  app:
    runs-on: ubuntu-latest
    # Needs the server's openapi.json, which lives in the same checkout.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Check generated API types are current
        run: |
          npm run api:types
          if ! git diff --exit-code --stat -- src/api/generated.ts; then
            echo "::error::src/api/generated.ts is stale. Run 'npm run api:types' and commit the result."
            exit 1
          fi
